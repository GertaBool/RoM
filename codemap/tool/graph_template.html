<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RoM code graph</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: light;
  --surface-1:#fcfcfb; --surface-2:#f3f2ee; --line:#dedcd5; --text-primary:#1f1e1c; --text-secondary:#5c5a55; --muted:#8b8982;
  --accent:#2a78d6; --neutral:#8b8982;
  --g0:#2a78d6; --g1:#eb6834; --g2:#1baf7a; --g3:#eda100; --g4:#e87ba4; --g5:#008300; --g6:#6250d6; --g7:#e34948; }
:root[data-theme="dark"] { color-scheme: dark;
  --surface-1:#1a1a19; --surface-2:#242422; --line:#3a3936; --text-primary:#f0efec; --text-secondary:#c3c2b7; --muted:#8f8d86;
  --accent:#3987e5; --neutral:#8f8d86;
  --g0:#3987e5; --g1:#d95926; --g2:#199e70; --g3:#c98500; --g4:#d55181; --g5:#0ca30c; --g6:#9085e9; --g7:#e66767; }
* { box-sizing:border-box; }
body { margin:0; font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--surface-1); color:var(--text-primary);
  display:flex; flex-direction:column; height:100vh; }
header { display:flex; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:14px; margin:0 8px 0 0; font-weight:600; }
.seg button, header > button { background:var(--surface-2); color:var(--text-primary); border:1px solid var(--line); padding:4px 10px; cursor:pointer; font:inherit; }
.seg button:first-child { border-radius:6px 0 0 6px; } .seg button:last-child { border-radius:0 6px 6px 0; margin-left:-1px; }
.seg button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
header > button { border-radius:6px; }
#searchwrap { position:relative; flex:1; min-width:260px; max-width:620px; }
#q { width:100%; padding:5px 9px; border:1px solid var(--line); border-radius:6px; background:var(--surface-1); color:var(--text-primary); font:inherit; }
#sugg { position:absolute; top:100%; left:0; right:0; background:var(--surface-1); border:1px solid var(--line); border-radius:6px; z-index:10;
  max-height:60vh; overflow:auto; display:none; box-shadow:0 4px 16px rgba(0,0,0,.15); }
#sugg div { padding:4px 9px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#sugg div.act, #sugg div:hover { background:var(--surface-2); }
#sugg small { color:var(--muted); margin-left:6px; }
main { flex:1; display:flex; min-height:0; }
#viz { flex:1; position:relative; min-width:0; overflow:auto; }
svg { display:block; }
aside { width:420px; border-left:1px solid var(--line); overflow:auto; padding:10px 14px; }
aside h2 { font-size:14px; margin:4px 0 6px; word-break:break-all; } aside h3 { font-size:12px; margin:14px 0 4px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; }
aside table { border-collapse:collapse; width:100%; } aside td { padding:1px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
aside td.n { text-align:right; font-variant-numeric:tabular-nums; color:var(--text-secondary); white-space:nowrap; }
a.l { color:var(--accent); cursor:pointer; text-decoration:none; } a.l:hover { text-decoration:underline; }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:baseline; }
.sq { display:inline-block; width:9px; height:9px; margin-right:5px; vertical-align:baseline; }
.legend { display:flex; flex-wrap:wrap; gap:4px 14px; padding:5px 12px; border-bottom:1px solid var(--line); font-size:12px; color:var(--text-secondary); }
.legend div { white-space:nowrap; }
.tip { position:fixed; pointer-events:none; background:var(--surface-1); border:1px solid var(--line); border-radius:6px; padding:5px 8px;
  font-size:12px; box-shadow:0 2px 10px rgba(0,0,0,.18); display:none; max-width:440px; z-index:5; }
.muted { color:var(--muted); } .small { font-size:12px; }
text { fill:var(--text-primary); font-size:11px; }
.edge { stroke:var(--muted); fill:none; }
.nodebox { stroke:var(--surface-1); stroke-width:2; }
.colhead { fill:var(--text-secondary); font-size:12px; font-weight:600; }
.kind { fill:var(--muted); font-size:9px; }
</style>
</head>
<body>
<header>
  <h1>RoM code graph</h1>
  <div class="seg"><button id="bFiles" class="on">Files</button><button id="bImpact">Impact</button></div>
  <div id="searchwrap"><input id="q" placeholder="Search a C++ or Python function, member (m_...), <XML tag>, #DEFINE, or file" autocomplete="off"><div id="sugg"></div></div>
  <button id="theme">Dark</button>
</header>
<div class="legend" id="legend"></div>
<main><div id="viz"><svg id="svg"></svg></div><aside id="side"></aside></main>
<div class="tip" id="tip"></div>
<script>
const D = /*DATA*/null;
const $ = s => document.querySelector(s), svg = $('#svg'), side = $('#side'), tip = $('#tip');
const NS = 'http://www.w3.org/2000/svg';
const N = D.K.length, KIND = D.kinds, LINK = D.links, PYG = D.groups.length - 1;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const col = g => g >= 0 ? `var(--g${g})` : 'var(--neutral)';
const kindName = {cpp: 'C++ function', new: 'C++ function (newer than the map)', py: 'Python function', member: 'member variable', tag: 'XML tag', define: 'define'};
const kindShort = {cpp: 'C++', new: 'C++', py: 'py', member: 'mem', tag: 'xml', define: 'def'};
const kind = i => KIND[D.K[i]], file = i => D.files[D.F[i]];
// dependency lists and their reverse (what a node depends on)
const dep = new Array(N), rdep = Array.from({length: N}, () => []);
for (let i = 0; i < N; i++) dep[i] = [];
for (const a in D.D) { const f = D.D[a]; for (let k = 0; k < f.length; k += 2) { dep[a].push([f[k], f[k + 1]]); rdep[f[k]].push([+a, f[k + 1]]); } }
const writes = D.W;

$('#legend').innerHTML = D.groups.map((g, k) => `<div><span class="dot" style="background:${col(k)}"></span>${esc(k === PYG ? 'Python' : 'C++: ' + g)}</div>`).join('') +
  '<div><span class="sq" style="background:var(--neutral)"></span>member, XML tag or file, define</div>';
$('#theme').onclick = () => { const d = document.documentElement, dark = d.dataset.theme !== 'dark'; d.dataset.theme = dark ? 'dark' : 'light'; $('#theme').textContent = dark ? 'Light' : 'Dark'; };
if (matchMedia('(prefers-color-scheme: dark)').matches) $('#theme').click();

// ---------- search ----------
const index = [];
for (let i = 0; i < N; i++) { const k = kind(i); index.push([k === 'tag' ? D.L[i] : k === 'define' ? '#' + D.L[i] : D.L[i] + (k === 'py' ? ' (' + file(i) + ')' : ''), kindName[k], i]); }
D.fnodes.forEach((f, k) => index.push([f[0], f[1] === 'xml' ? 'XML file' : f[1] === 'py' ? 'Python module' : 'C++ file', 'f' + k]));
const lower = index.map(x => x[0].toLowerCase());
let act = -1, hits = [];
$('#q').addEventListener('input', () => {
  const q = $('#q').value.trim().toLowerCase(); act = -1;
  if (!q) { $('#sugg').style.display = 'none'; return; }
  hits = [];
  for (let k = 0; k < index.length && hits.length < 500; k++) if (lower[k].includes(q)) hits.push(k);
  hits.sort((a, b) => (lower[a].startsWith(q) || lower[a].includes('::' + q) ? 0 : 1) - (lower[b].startsWith(q) || lower[b].includes('::' + q) ? 0 : 1) || lower[a].length - lower[b].length);
  hits = hits.slice(0, 50);
  $('#sugg').innerHTML = hits.map((k, n) => `<div data-n="${n}">${esc(index[k][0])}<small>${index[k][1]}</small></div>`).join('') || '<div class="muted">no match</div>';
  $('#sugg').style.display = 'block';
});
$('#sugg').addEventListener('mousedown', e => { const d = e.target.closest('[data-n]'); if (d) pick(hits[+d.dataset.n]); });
$('#q').addEventListener('keydown', e => {
  const items = [...$('#sugg').querySelectorAll('[data-n]')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { act = Math.max(0, Math.min(items.length - 1, act + (e.key === 'ArrowDown' ? 1 : -1))); items.forEach((x, n) => x.classList.toggle('act', n === act)); e.preventDefault(); }
  if (e.key === 'Enter' && hits.length) pick(hits[Math.max(act, 0)]);
  if (e.key === 'Escape') $('#sugg').style.display = 'none';
});
function pick(k) { $('#sugg').style.display = 'none'; const r = index[k]; $('#q').value = r[0]; const ref = r[2];
  if (typeof ref === 'string') { setMode('files'); selectFile(+ref.slice(1)); } else { setMode('impact'); impact([ref], r[0]); } }
window.go = i => { $('#q').value = D.L[i]; setMode('impact'); impact([i], D.L[i]); };
window.gofile = k => { setMode('files'); selectFile(k); };
window.impactFile = k => { const f = D.fnodes[k]; let seeds = [];
  if (f[1] === 'xml') { for (let i = 0; i < N; i++) if (kind(i) === 'tag' && (D.extra[i] || {}).files && D.extra[i].files.some(r => r[0] === f[0] && r[2])) seeds.push(i); }
  else for (let i = 0; i < N; i++) if (file(i) === f[0] && (kind(i) === 'cpp' || kind(i) === 'py')) seeds.push(i);
  setMode('impact'); impact(seeds, f[0]); };

// ---------- modes ----------
let mode = 'files', lastImpact = null;
function setMode(m) { mode = m; $('#bFiles').classList.toggle('on', m === 'files'); $('#bImpact').classList.toggle('on', m === 'impact'); if (m === 'files') drawFiles(); }
$('#bFiles').onclick = () => { setMode('files'); fileSide(); };
$('#bImpact').onclick = () => { setMode('impact'); if (lastImpact) impact(...lastImpact); else { svg.innerHTML = ''; side.innerHTML = '<p class="muted">Search for something to see what a change of it reaches.</p>'; } };

// ---------- file graph ----------
const FN = D.fnodes.length, fsize = D.fnodes.map(f => f[3]);
const strong = D.fedges.slice().sort((a, b) => b[2] - a[2]).slice(0, 900);
let pos = null, selFile = -1;
const fcol = k => D.fnodes[k][1] === 'xml' ? 'var(--neutral)' : col(D.fnodes[k][2]);
function layout(W, H) {
  const rad = D.fnodes.map((f, k) => f[1] === 'xml' ? 4 : 3 + Math.sqrt(fsize[k]) * 0.9);
  const p = D.fnodes.map((f, k) => { const a = 2 * Math.PI * k / FN; const r = Math.min(W, H) * (f[1] === 'cpp' ? 0.22 : 0.4); return {x: W / 2 + r * Math.cos(a), y: H / 2 + r * Math.sin(a), vx: 0, vy: 0}; });
  const lw = strong.map(e => Math.log(1 + e[2]));
  for (let it = 0; it < 300; it++) {
    const t = 1 - it / 300;
    for (let a = 0; a < FN; a++) for (let b = a + 1; b < FN; b++) {
      const dx = p[a].x - p[b].x, dy = p[a].y - p[b].y, d2 = dx * dx + dy * dy + 0.01, d = Math.sqrt(d2), f = 180 * (rad[a] + 4) * (rad[b] + 4) / 12 / d2;
      p[a].vx += dx / d * f; p[a].vy += dy / d * f; p[b].vx -= dx / d * f; p[b].vy -= dy / d * f;
    }
    strong.forEach((e, k) => { const a = p[e[0]], b = p[e[1]], dx = b.x - a.x, dy = b.y - a.y, f = 0.0016 * lw[k]; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f; });
    p.forEach(q => { q.vx += (W / 2 - q.x) * 0.004; q.vy += (H / 2 - q.y) * 0.004; q.x += Math.max(-20, Math.min(20, q.vx)) * t; q.y += Math.max(-20, Math.min(20, q.vy)) * t; q.vx *= 0.5; q.vy *= 0.5;
      q.x = Math.max(30, Math.min(W - 30, q.x)); q.y = Math.max(20, Math.min(H - 20, q.y)); });
  }
  p.rad = rad; return p;
}
function drawFiles() {
  const W = $('#viz').clientWidth || 900, H = $('#viz').clientHeight || 700;
  if (!pos || pos.W !== W || pos.H !== H) { pos = layout(W, H); pos.W = W; pos.H = H; }
  svg.innerHTML = ''; svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const ge = el('g', {}, svg), gn = el('g', {}, svg), maxw = strong[0] ? strong[0][2] : 1, nb = new Set();
  strong.forEach(e => {
    const on = selFile >= 0 && (e[0] === selFile || e[1] === selFile);
    if (on) { nb.add(e[0]); nb.add(e[1]); }
    el('line', {x1: pos[e[0]].x, y1: pos[e[0]].y, x2: pos[e[1]].x, y2: pos[e[1]].y, class: 'edge',
      'stroke-width': on ? 1.5 + 2 * e[2] / maxw : 0.6, 'stroke-opacity': selFile < 0 ? 0.08 + 0.5 * Math.sqrt(e[2] / maxw) : (on ? 0.85 : 0.03),
      stroke: on ? (e[0] === selFile ? 'var(--accent)' : 'var(--g1)') : null}, ge);
  });
  D.fnodes.forEach((f, k) => {
    const r = pos.rad[k], dim = selFile >= 0 && !nb.has(k) && k !== selFile, c = fcol(k);
    const node = f[1] === 'xml' ? el('rect', {x: pos[k].x - r, y: pos[k].y - r, width: 2 * r, height: 2 * r, fill: c, class: 'nodebox', opacity: dim ? 0.15 : 1, style: 'cursor:pointer'}, gn)
      : el('circle', {cx: pos[k].x, cy: pos[k].y, r, fill: c, class: 'nodebox', opacity: dim ? 0.15 : 1, style: 'cursor:pointer'}, gn);
    node.onmouseenter = ev => showTip(ev, `<b>${esc(f[0])}</b><br>${f[1] === 'xml' ? 'XML file' : f[1] === 'py' ? 'Python module, ' + fsize[k] + ' functions' : esc(D.groups[f[2]]) + ', ' + fsize[k] + ' functions'}`);
    node.onmouseleave = hideTip; node.onclick = () => selectFile(k);
    if (fsize[k] > 300 || k === selFile || (selFile >= 0 && nb.has(k)))
      el('text', {x: pos[k].x + r + 3, y: pos[k].y + 4, opacity: dim ? 0.3 : 1, 'font-weight': k === selFile ? 700 : 400}, gn).textContent = f[0];
  });
}
function selectFile(k) { selFile = k; drawFiles(); fileSide(); }
function fileSide() {
  if (selFile < 0) {
    const c = {cpp: 0, py: 0, xml: 0}; D.fnodes.forEach(f => c[f[1]]++);
    side.innerHTML = `<h2>Files and what connects them</h2><p class="small">${c.cpp} C++ files, ${c.py} Python modules and ${c.xml} loaded XML files. Lines: the ${strong.length} strongest file-to-file links, counted in function-level links: C++ calls, Python calls into C++ and back, event handlers, Python calls between modules, and XML files to the C++ files whose functions read the members they fill. Click a file; search for anything to see what a change of it reaches.</p><p class="small muted">${esc(D.commit)}</p>`;
    return;
  }
  const f = D.fnodes[selFile];
  const outE = D.fedges.filter(e => e[0] === selFile).sort((a, b) => b[2] - a[2]), inE = D.fedges.filter(e => e[1] === selFile).sort((a, b) => b[2] - a[2]);
  const row = (k, n, ls) => `<tr><td><span class="${D.fnodes[k][1] === 'xml' ? 'sq' : 'dot'}" style="background:${fcol(k)}"></span><a class="l" onclick="gofile(${k})">${esc(D.fnodes[k][0])}</a> <span class="muted small">${ls.join(', ')}</span></td><td class="n">${n}</td></tr>`;
  let fns = [];
  if (f[1] !== 'xml') for (let i = 0; i < N; i++) if (file(i) === f[0] && (kind(i) === 'cpp' || kind(i) === 'py')) fns.push(i);
  fns.sort((a, b) => D.LN[a] - D.LN[b]);
  const mems = []; if (f[1] === 'cpp') for (let i = 0; i < N; i++) if (kind(i) === 'member' && file(i) === f[0]) mems.push(i);
  const tags = []; if (f[1] === 'xml') for (let i = 0; i < N; i++) if (kind(i) === 'tag' && D.extra[i] && D.extra[i].files.some(r => r[0] === f[0] && r[2])) tags.push(i);
  side.innerHTML = `<h2>${esc(f[0])}</h2><div class="small muted">${f[1] === 'xml' ? 'XML file' : f[1] === 'py' ? 'Python module' : 'C++ file, ' + esc(D.groups[f[2]])}</div>
   <p><a class="l" onclick="impactFile(${selFile})">What a change of this file reaches</a></p>
   <h3>Depends on (links)</h3><table>${outE.slice(0, 30).map(e => row(e[1], e[2], e[3])).join('')}</table>${outE.length > 30 ? `<div class="muted small">+${outE.length - 30} more</div>` : ''}
   <h3>Depended on by</h3><table>${inE.slice(0, 30).map(e => row(e[0], e[2], e[3])).join('')}</table>${inE.length > 30 ? `<div class="muted small">+${inE.length - 30} more</div>` : ''}
   ${fns.length ? `<h3>Functions (${fns.length})</h3><div class="small">${fns.map(i => `${link(i)} <span class="muted">${D.LN[i]}</span>`).join('<br>')}</div>` : ''}
   ${mems.length ? `<h3>Members declared (${mems.length})</h3><div class="small">${mems.map(i => link(i)).join('<br>')}</div>` : ''}
   ${tags.length ? `<h3>Tags the DLL reads from it (${tags.length})</h3><div class="small">${tags.map(i => link(i)).join(', ')}</div>` : ''}`;
}

// ---------- impact ----------
function reach(seeds, followWrites) {
  const lv = new Map(); seeds.forEach(s => lv.set(s, [0, -1, -1]));
  let fr = [...seeds], d = 0;
  while (fr.length) { d++; const nx = [];
    for (const a of fr) {
      const es = dep[a].slice();
      if (followWrites && lv.get(a)[0] === 0 && writes[a]) writes[a].forEach(m => es.push([m, LINK.indexOf('writes')]));
      for (const [b, l] of es) if (!lv.has(b)) { lv.set(b, [d, a, l]); nx.push(b); }
    }
    fr = nx; }
  return lv;
}
function link(i) { return `<a class="l" onclick="go(${i})">${esc(D.L[i])}</a>`; }
function nodeCol(i) { return D.GP[i] >= 0 ? col(D.GP[i]) : 'var(--neutral)'; }
function xmlRows(rows) { return rows.map(r => `${esc(r[0])} <span class="muted">[${r[1]}${r[2] ? '' : ', shadowed'}]</span>`).join('<br>'); }
function impact(seeds, title) {
  lastImpact = [seeds, title];
  const followWrites = seeds.some(s => kind(s) === 'cpp' || kind(s) === 'py');
  const lv = reach(seeds, followWrites), levels = [];
  lv.forEach((v, i) => (levels[v[0]] = levels[v[0]] || []).push(i));
  drawImpact(levels, lv);
  const all = [...lv.keys()], byKind = {};
  all.forEach(i => { const k = kind(i); byKind[k] = byKind[k] || [0, 0]; byKind[k][lv.get(i)[0] ? 1 : 0]++; });
  const ex = all.filter(i => D.FL[i] & 1).length, pb = all.filter(i => D.FL[i] & 2).length;
  const ev = all.filter(i => D.extra[i] && D.extra[i].events);
  const fc = {}; all.forEach(i => { const k = kind(i); if (k === 'cpp' || k === 'py') fc[file(i)] = (fc[file(i)] || 0) + 1; });
  let head = '';
  if (seeds.length === 1) {
    const i = seeds[0], k = kind(i), x = D.extra[i] || {};
    head += `<div class="small muted">${kindName[k]}${file(i) ? ' &middot; ' + esc(file(i)) + (D.LN[i] ? ':' + D.LN[i] : '') : ''}</div>`;
    if (k === 'member') {
      head += `<div class="small">${esc(x.type)}${D.FL[i] & 4 ? ' &middot; serialized in read/write(FDataStreamBase*): its type and order fix the stream (save) format' : ''}</div>`;
      const w = rdep[i].length ? [] : []; const writers = []; for (const a in writes) if (writes[a].includes(i)) writers.push(+a);
      head += `<h3>Written by (${writers.length})</h3><div class="small">${writers.map(link).join('<br>') || '<span class="muted">none</span>'}</div>`;
      head += `<h3>Read by (${dep[i].length})</h3><div class="small">${dep[i].map(e => link(e[0])).join('<br>') || '<span class="muted">none</span>'}</div>`;
      (x.xml || []).forEach(([t, rows, known]) => head += `<h3>Filled from XML &lt;${esc(t)}&gt;</h3><div class="small">${known ? xmlRows(rows) || 'no loaded file holds it' : 'loader of the class not found'}</div>`);
    } else if (k === 'tag' || k === 'define') {
      head += `<h3>In XML files</h3><div class="small">${xmlRows(x.files || []) || '<span class="muted">none in the scan</span>'}</div>`;
      head += `<h3>${k === 'tag' ? 'Fills' : 'Read by'}</h3><div class="small">${dep[i].map(e => link(e[0])).join('<br>')}</div>`;
    } else {
      head += `<h3>Depends on (${rdep[i].length})</h3><div class="small">${rdep[i].slice(0, 80).map(e => link(e[0]) + ` <span class="muted">${LINK[e[1]]}</span>`).join('<br>')}</div>`;
      if (x.events) head += `<div class="small">handles event(s): ${x.events.map(esc).join(', ')}</div>`;
    }
  }
  side.innerHTML = `<h2>${esc(title)}</h2>${head}
    <h3>What a change reaches</h3><table>${Object.entries(byKind).map(([k, v]) => `<tr><td>${kindName[k]}</td><td class="n">${v[0]} start</td><td class="n">${v[1]} reached</td></tr>`).join('')}</table>
    <div class="small">per level: ${levels.map((l, d) => d + ': ' + (l ? l.length : 0)).join(', ')}</div>
    <h3>Exits</h3><div class="small">C++ functions the exe calls: ${ex}<br>C++ functions bound for Python: ${pb}<br>Python event handlers: ${ev.length}${ev.length ? ' &mdash; ' + ev.slice(0, 20).map(i => esc(D.L[i])).join(', ') : ''}</div>
    <h3>Files reached</h3><table>${Object.entries(fc).sort((a, b) => b[1] - a[1]).slice(0, 40).map(([f, n]) => `<tr><td>${esc(f)}</td><td class="n">${n}</td></tr>`).join('')}</table>
    <p class="small muted">Links: ${LINK.join(', ')}. ${followWrites ? 'Members the start functions write are followed. ' : ''}${esc(D.commit)}</p>`;
}
function drawImpact(levels, lv) {
  const W0 = $('#viz').clientWidth || 900, H0 = $('#viz').clientHeight || 700, MAXN = 40, colW = 230, rowH = 18;
  const cols = levels.length, W = Math.max(W0, cols * colW + 40), H = Math.max(H0, 50 + (MAXN + 1) * rowH);
  svg.innerHTML = ''; svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const ge = el('g', {}, svg), gn = el('g', {}, svg), P = new Map();
  for (let d = 0; d < cols; d++) {
    const x = 20 + d * colW, list = (levels[d] || []).slice().sort((a, b) => D.K[a] - D.K[b] || D.L[a].localeCompare(D.L[b]));
    el('text', {x, y: 18, class: 'colhead'}, gn).textContent = d === 0 ? `start (${list.length})` : `level ${d} (${list.length})`;
    list.slice(0, MAXN).forEach((i, n) => {
      const y = 38 + n * rowH; P.set(i, [x, y]); const k = kind(i);
      if (k === 'cpp' || k === 'new' || k === 'py') el('circle', {cx: x + 4, cy: y, r: 4, fill: nodeCol(i)}, gn);
      else el('rect', {x, y: y - 4, width: 8, height: 8, fill: 'var(--neutral)'}, gn);
      el('text', {x: x + 12, y: y + 4, class: 'kind'}, gn).textContent = kindShort[k];
      const t = el('text', {x: x + 34, y: y + 4, style: 'cursor:pointer'}, gn), nm = D.L[i], max = Math.floor((colW - 40) / 6.1);
      t.textContent = nm.length > max ? '…' + nm.slice(-max) : nm;
      const v = lv.get(i);
      t.onmouseenter = ev => showTip(ev, `<b>${esc(nm)}</b><br>${kindName[k]}${file(i) ? '<br>' + esc(file(i)) + (D.LN[i] ? ':' + D.LN[i] : '') : ''}${v[1] >= 0 ? '<br>reached by <i>' + LINK[v[2]] + '</i> from ' + esc(D.L[v[1]]) : ''}`);
      t.onmouseleave = hideTip; t.onclick = () => go(i);
    });
    if (list.length > MAXN) el('text', {x: x + 12, y: 38 + MAXN * rowH + 4, class: 'colhead'}, gn).textContent = `+${list.length - MAXN} more`;
  }
  P.forEach(([x, y], i) => { const v = lv.get(i); if (v[1] < 0) return; const q = P.get(v[1]); if (!q) return;
    const x1 = q[0] + colW - 12, x2 = x - 2; el('path', {d: `M${x1},${q[1]} C${(x1 + x2) / 2},${q[1]} ${(x1 + x2) / 2},${y} ${x2},${y}`, class: 'edge', 'stroke-opacity': 0.35}, ge); });
  if (!levels.length) el('text', {x: 20, y: 40}, gn).textContent = 'Nothing in the map to start from.';
}
function showTip(ev, html) { tip.innerHTML = html; tip.style.display = 'block'; tip.style.left = Math.min(ev.clientX + 12, innerWidth - 460) + 'px'; tip.style.top = (ev.clientY + 12) + 'px'; }
function hideTip() { tip.style.display = 'none'; }
addEventListener('resize', () => { if (mode === 'files') drawFiles(); });
drawFiles(); fileSide();
</script>
